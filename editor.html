<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DET Tracker — Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.toolbar{position:sticky;top:0;z-index:100;background:#115e66;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.toolbar h1{font-size:18px;font-weight:700;margin-right:auto}
.toolbar button{padding:8px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s}
.btn-export{background:#00c7b0;color:#fff}.btn-export:hover{background:#00b09e}
.btn-save{background:#fc9900;color:#fff}.btn-save:hover{background:#e08800}
.btn-load{background:#fff;color:#115e66}.btn-load:hover{background:#e8e8e8}
.btn-preview{background:#ba2b87;color:#fff}.btn-preview:hover{background:#a02575}
.btn-reset{background:#d61220;color:#fff}.btn-reset:hover{background:#b50f1b}
.container{max-width:1100px;margin:0 auto;padding:24px}
.section{background:#fff;border-radius:10px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
.section-header{padding:16px 20px;background:#fafafa;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;cursor:pointer;user-select:none}
.section-header h2{font-size:15px;font-weight:700;color:#115e66;flex:1}
.section-header .toggle{font-size:18px;color:#999;transition:.2s}
.section-header.collapsed .toggle{transform:rotate(-90deg)}
.section-body{padding:20px}
.section-body.hidden{display:none}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:#555;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#115e66;outline:none;box-shadow:0 0 0 3px rgba(17,94,102,.1)}
.field textarea{min-height:80px;resize:vertical}
.row{display:grid;gap:12px}.row-2{grid-template-columns:1fr 1fr}.row-3{grid-template-columns:1fr 1fr 1fr}.row-4{grid-template-columns:1fr 1fr 1fr 1fr}
.card{border:1px solid #e5e5e5;border-radius:8px;padding:16px;background:#fafbfc}
.card-title{font-size:13px;font-weight:700;color:#115e66;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #eee}
.source-toggle{display:flex;align-items:center;gap:0;margin-bottom:8px}
.source-toggle span{font-size:11px;font-weight:600;color:#888}
.source-pills{display:flex;border-radius:6px;overflow:hidden;border:1px solid #ddd}
.source-pills button{padding:6px 14px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:#f5f5f5;color:#888;transition:.2s;border-right:1px solid #ddd}
.source-pills button:last-child{border-right:none}
.source-pills button.active{background:#115e66;color:#fff}
.source-pills button:hover:not(.active){background:#e8e8e8}
.api-fields{background:#f0f7f7;border:1px solid #d0e0e0;border-radius:6px;padding:12px;margin-top:8px}
.api-fields.hidden{display:none}
.api-fields label{color:#115e66}
.embed-fields{background:#f7f0f7;border:1px solid #d0c0e0;border-radius:6px;padding:12px;margin-top:8px}
.embed-fields.hidden{display:none}
.embed-fields label{color:#7b2d8e}
.embed-fields textarea{min-height:100px;font-family:'Menlo','Monaco','Courier New',monospace;font-size:12px;background:#faf5fc;border-color:#d0c0e0}
.embed-fields textarea:focus{border-color:#7b2d8e;box-shadow:0 0 0 3px rgba(123,45,142,.1)}
.embed-preview{margin-top:8px;border:1px dashed #d0c0e0;border-radius:6px;padding:12px;background:#fff;min-height:60px}
.embed-preview-label{font-size:10px;font-weight:600;color:#7b2d8e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.btn-test{display:inline-block;padding:5px 14px;background:#00c7b0;color:#fff;border:none;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px}
.btn-test:hover{background:#00b09e}
.test-result{font-size:12px;color:#115e66;margin-top:4px;font-weight:500}
.item-list .item{border:1px solid #e5e5e5;border-radius:8px;padding:14px;margin-bottom:10px;background:#fafbfc;position:relative}
.btn-remove{position:absolute;top:8px;right:8px;background:#d61220;color:#fff;border:none;width:24px;height:24px;border-radius:50%;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-add{padding:8px 16px;background:#115e66;color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-add:hover{background:#0d4a52}
.status-select{padding:6px 10px!important;font-size:13px!important}
.preview-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:center;justify-content:center}
.preview-overlay.show{display:flex}
.preview-frame{width:90vw;height:90vh;background:#fff;border-radius:12px;overflow:hidden;position:relative}
.preview-frame iframe{width:100%;height:100%;border:none}
.preview-close{position:absolute;top:10px;right:10px;background:#d61220;color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;z-index:10}
#fileInput{display:none}
.help-text{font-size:11px;color:#999;margin-top:3px}
</style>
</head>

  <button class="btn-save" onclick="saveConfig()">💾 Save Config</button>
  <button class="btn-load" onclick="document.getElementById('fileInput').click()">📂 Load Config</button>
  <button class="btn-reset" onclick="resetAll()">🔄 Reset</button>
  <input type="file" id="fileInput" accept=".json" onchange="loadConfig(event)">
</div>

<div class="container" id="editorContainer">

</div>

<div class="preview-overlay" id="previewOverlay">

    <button class="preview-close" onclick="closePreview()">✕</button>

// ============================================================
// AUTO-SAVE
// ============================================================
function autoSave() {
  try { localStorage.setItem('det_editor_config', JSON.stringify(config)); } catch(e) {}
}
function autoLoad() {
  try {
    const saved = localStorage.getItem('det_editor_config');
    if (saved) config = JSON.parse(saved);
  } catch(e) {}
}

// ============================================================
// UI BUILDER
// ============================================================
function buildEditor() {
  const c = document.getElementById('editorContainer');
  c.innerHTML = '';
  c.appendChild(buildHeaderSection());
  c.appendChild(buildHeroCardsSection());
  c.appendChild(buildSectorsSection());
  c.appendChild(buildWinnersSection());
  c.appendChild(buildLosersSection());
  c.appendChild(buildStorySection());
  c.appendChild(buildMomentumSection());
  c.appendChild(buildSectorBreakdownSection());
  c.appendChild(buildMethodologySection());
}

function makeSection(title, id, content) {
  const s = document.createElement('div');
  s.className = 'section';
  s.innerHTML = `<div class="section-header" onclick="toggleSection('${id}')"><h2>${title}</h2><span class="toggle">▼</span></div>`;
  const body = document.createElement('div');
  body.className = 'section-body';
  body.id = id;
  if (typeof content === 'string') body.innerHTML = content;
  else body.appendChild(content);
  s.appendChild(body);
  return s;
}

function toggleSection(id) {
  const body = document.getElementById(id);
  const header = body.previousElementSibling;
  body.classList.toggle('hidden');
  header.classList.toggle('collapsed');
}

function sourceToggle(obj, prefix, onUpdate) {
  const mode = obj.sourceMode || 'manual';
  return `
    <div class="source-toggle">
      <div class="source-pills">
        <button class="${mode==='manual'?'active':''}" onclick="setSourceMode('${prefix}','manual')">📝 Manual</button>
        <button class="${mode==='api'?'active':''}" onclick="setSourceMode('${prefix}','api')">🔗 API</button>
        <button class="${mode==='embed'?'active':''}" onclick="setSourceMode('${prefix}','embed')">🧩 HTML Embed</button>
      </div>
    </div>
    <div class="api-fields ${mode==='api' ? '' : 'hidden'}" id="${prefix}_api">
      <div class="field"><label>API URL</label><input type="text" value="${esc(obj.apiUrl || '')}" onchange="updateField('${prefix}','apiUrl',this.value)" placeholder="https://your-api.com/endpoint"></div>
      <div class="field"><label>JSON Path</label><input type="text" value="${esc(obj.apiPath || '')}" onchange="updateField('${prefix}','apiPath',this.value)" placeholder="data.value"><div class="help-text">e.g. data.consumer.recovery_pct</div></div>
      <button class="btn-test" onclick="testApi('${prefix}')">⚡ Test</button>
      <div class="test-result" id="${prefix}_result"></div>
    </div>
    <div class="embed-fields ${mode==='embed' ? '' : 'hidden'}" id="${prefix}_embed">
      <div class="field"><label>HTML Embed Code</label><textarea placeholder="Paste HTML, iframe, or widget code here..." onchange="updateField('${prefix}','htmlEmbed',this.value)">${esc(obj.htmlEmbed || '')}</textarea><div class="help-text">Paste any HTML snippet — iframes, charts, widgets, live data embeds</div></div>
      <button class="btn-test" style="background:#7b2d8e" onclick="previewEmbed('${prefix}')">👁 Preview Embed</button>
      <div class="embed-preview hidden" id="${prefix}_embed_preview"><div class="embed-preview-label">Preview</div><div id="${prefix}_embed_content"></div></div>
    </div>`;
}

// ============================================================
// HELPERS
// ============================================================
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setSourceMode(prefix, mode) {
  const obj = getObjByPrefix(prefix);
  if (!obj) return;
  obj.sourceMode = mode;
  autoSave();
  buildEditor();
}

function previewEmbed(prefix) {
  const obj = getObjByPrefix(prefix);
  if (!obj || !obj.htmlEmbed) return;
  const previewEl = document.getElementById(prefix + '_embed_preview');
  const contentEl = document.getElementById(prefix + '_embed_content');
  previewEl.classList.remove('hidden');
  contentEl.innerHTML = obj.htmlEmbed;
}

function updateField(prefix, field, value) {
  const obj = getObjByPrefix(prefix);
  if (obj) { obj[field] = value; autoSave(); }
}

function getObjByPrefix(prefix) {
  const parts = prefix.split('_');
  if (parts[0] === 'hero') return config.heroCards[parseInt(parts[1])];
  if (parts[0] === 'sector') return config.sectors[parseInt(parts[1])];
  if (parts[0] === 'winners') return config.winners[parseInt(parts[1])];
  if (parts[0] === 'losers') return config.losers[parseInt(parts[1])];
  if (parts[0] === 'mom') return config.momentum[parseInt(parts[1])];
  if (parts[0] === 'sb') return config.sectorBreakdown[parseInt(parts[1])].kpis[parseInt(parts[2])];
  return null;
}

async function testApi(prefix) {
  const obj = getObjByPrefix(prefix);
  if (!obj) return;
  const resultEl = document.getElementById(prefix + '_result');
  resultEl.textContent = 'Fetching...';
  try {
    const res = await fetch(obj.apiUrl);
    const json = await res.json();
    const val = obj.apiPath.split('.').reduce((o, k) => o && o[k], json);
    resultEl.textContent = `✅ Result: ${val}`;
    resultEl.style.color = '#00c7b0';
  } catch(e) {
    resultEl.textContent = `❌ Error: ${e.message}`;
    resultEl.style.color = '#d61220';
  }
}

function saveConfig() {
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `DET-Config-${config.header.date || 'draft'}.json`;
  a.click();
}

function loadConfig(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      config = JSON.parse(e.target.result);
      autoSave();
      buildEditor();
      alert('Config loaded successfully!');
    } catch(err) { alert('Invalid JSON file'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function resetAll() {
  if (!confirm('Reset all fields to default? This cannot be undone.')) return;
  config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  autoSave();
  buildEditor();
}

  document.getElementById('previewOverlay').classList.add('show');
}

function closePreview() {

  const allApiFields = [];
  c.heroCards.forEach((h,i) => { if(h.sourceMode==='api'&&h.apiUrl) allApiFields.push({id:`hero-val-${i}`,url:h.apiUrl,path:h.apiPath}); });

      }
      return `
      <div style="margin-bottom:12px;cursor:default" title="${esc(k.tooltip)}">
        <div style="display:flex;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:13px;font-weight:600;color:#003d4c">${esc(k.label)}</span>
          <span style="display:flex;align-items:center;gap:8px">
            ${k.wow ? `<span style="font-size:11px;font-weight:600;color:${k.wowDir==='positive'?'#00c7b0':k.wowDir==='negative'?'#d61220':'#999'}">${esc(k.wow)} WoW</span>` : ''}
            <span id="sb-val-${si}-${ki}" style="font-size:14px;font-weight:800;color:${barColor(k.value)}">${k.value}%</span>
          </span>
        </div>
        <div style="height:8px;background:#eee;border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${Math.min(k.value,200)/2}%;background:${barColor(k.value)};border-radius:4px;transition:width 1s ease"></div>
        </div>
      </div>`;
    }).join('');
    return `
      <div style="background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:4px solid ${statusColor(sec.status)}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <h3 style="font-size:18px;font-weight:700;color:#115e66">${esc(sec.name)}</h3>
          <span style="padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;background:${statusColor(sec.status)}">${statusLabel(sec.status)}</span>
        </div>
        <p style="font-size:14px;color:#2a3f45;line-height:1.7;margin-bottom:20px">${esc(sec.narrative)}</p>
        ${kpisHtml}
      </div>`;
  }).join('');

  const methodLines = c.methodology.split('\n').map(l => l.trim() ? `<p style="margin-bottom:8px">${esc(l)}</p>` : '').join('');

  const dateFormatted = c.header.date ? new Date(c.header.date + 'T00:00:00').toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' }) : '';

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${esc(c.header.title)} — ${esc(c.header.edition)} · ${dateFormatted}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f5f3ef;color:#003d4c;line-height:1.6}
.doc{max-width:960px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)}
.header{background:linear-gradient(135deg,#115e66 0%,#0d4a52 100%);color:#fff;padding:40px 48px;position:relative}
.header-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px;opacity:.85}
.header h1{font-family:'DM Sans',sans-serif;font-size:28px;font-weight:800;line-height:1.3}
.badge{background:rgba(214,18,32,.9);padding:4px 14px;border-radius:4px;font-size:11px;font-weight:700;letter-spacing:1px}
.section{padding:32px 48px}
.section-title{font-size:20px;font-weight:800;color:#115e66;margin-bottom:20px;padding-bottom:10px;border-bottom:2px solid #115e66}
.heroes{display:flex;gap:16px;margin-bottom:0}
.sector-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wl-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
table{width:100%;border-collapse:collapse}
table th{background:#115e66;color:#fff;padding:10px 14px;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
table td{border-bottom:1px solid #eee;padding:10px 14px}
table tr:hover{background:#f5f9f9}
.insight{background:#f0f7f7;border-left:4px solid #115e66;padding:16px 20px;border-radius:0 8px 8px 0;margin-top:20px}
.insight strong{color:#115e66}
.footer{background:#115e66;color:#fff;padding:20px 48px;display:flex;justify-content:space-between;font-size:12px;opacity:.9}
@media(max-width:768px){.heroes{flex-direction:column}.sector-grid{grid-template-columns:1fr 1fr}.wl-grid{grid-template-columns:1fr}.section{padding:24px 20px}.header{padding:24px 20px}}
@media print{body{background:#fff}.doc{box-shadow:none}}
</style>
</head>
<body>
<div class="doc">
  <div class="header">
    <div class="header-meta">
      <div><strong>${esc(c.header.title)}</strong> · ${esc(c.header.edition)} · ${dateFormatted}</div>
      <div style="display:flex;gap:12px;align-items:center">
        <span>Prepared for ${esc(c.header.preparedFor)}</span>
        ${c.header.confidential ? '<span class="badge">CONFIDENTIAL</span>' : ''}
      </div>
    </div>
    <h1>${esc(c.header.headline)}</h1>
  </div>

  <div class="section">
    <div class="section-title">Recovery at a Glance</div>
    <div class="heroes">${heroCardsHtml}</div>
  </div>

  <div class="section" style="padding-top:0">
    <div class="sector-grid">${sectorsHtml}</div>
  </div>

  <div class="section">
    <div class="section-title">Winners & Losers</div>
    <div class="wl-grid">
      <div><h3 style="color:#00c7b0;font-size:14px;margin-bottom:10px">🟢 Beating Baseline</h3>${winnersHtml}</div>
      <div><h3 style="color:#d61220;font-size:14px;margin-bottom:10px">🔴 Still Critical</h3>${losersHtml}</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">${esc(c.story.title)}</div>
    ${c.story.narrative.split('\n\n').map(p => `<p style="font-size:15px;color:#2a3f45;line-height:1.8;margin-bottom:14px">${esc(p)}</p>`).join('')}
    <div class="insight"><strong>Key Insight:</strong> ${esc(c.story.keyInsight)}</div>
  </div>

  <div class="section">
    <div class="section-title">4-Week Momentum</div>
    <table>
      <thead><tr><th style="text-align:left">KPI</th><th>W-3</th><th>W-2</th><th>W-1</th><th>Current</th><th style="text-align:right">Value</th></tr></thead>
      <tbody>${momRows}</tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">Sector Breakdown</div>
    ${breakdownHtml}
  </div>

  <div class="section">
    <div class="section-title">Methodology</div>
    <div style="font-size:13px;color:#2a3f45;line-height:1.8">${methodLines}</div>
  </div>

  <div class="footer">
    <span>${esc(c.header.title)} — Prepared by Dubai Economy & Tourism</span>
    <span>For ${esc(c.header.preparedFor)} members — ${c.header.confidential ? 'Confidential' : 'Internal'}</span>
  </div>
</div>
${apiFetches}
</body>
</html>`;
}

autoLoad();
buildEditor();
</script>
</body>
</html>
